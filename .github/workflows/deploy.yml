name: Deploy to k3s (EC2)

on:
  push:
    branches: [ "dev" ]
  workflow_dispatch:

env:
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  EC2_HOST: ${{ secrets.EC2_HOST }}
  EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
  EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
  K8S_NAMESPACE: semicolon

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [ auth, user, product, order, coupon, payment, deposit, settlement, ai ]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push (sha + latest)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_USERNAME }}/semicolon-${{ matrix.module }}:${{ github.sha }}
            ${{ env.DOCKER_USERNAME }}/semicolon-${{ matrix.module }}:latest
          build-args: |
            MODULE_NAME=${{ matrix.module }}
          cache-from: type=gha,scope=${{ matrix.module }}
          cache-to: type=gha,mode=max,scope=${{ matrix.module }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2 (k3s) via SSH - set image by sha
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.EC2_HOST }}
          username: ${{ env.EC2_USERNAME }}
          key: ${{ env.EC2_SSH_KEY }}
          port: 22
          script: |
            set -euo pipefail

            NS="${{ env.K8S_NAMESPACE }}"
            SHA="${{ github.sha }}"
            DOCKER_USERNAME="${{ env.DOCKER_USERNAME }}"
            K="sudo kubectl"

            echo "[1] cluster check"
            $K -n "$NS" get deploy

            echo "[2] rollout: set images by sha"
            for m in auth user product order coupon payment deposit settlement; do
              img="${DOCKER_USERNAME}/semicolon-${m}:${SHA}"
              echo " - deploy/${m} -> ${img}"
              $K -n "$NS" set image "deploy/${m}" "${m}=${img}"
            done

            echo "[2-1] annotate pod template with git metadata (revision tracking)"
            for m in auth user product order coupon payment deposit settlement; do
              $K -n "$NS" patch deploy/${m} -p "{
                \"spec\": {
                  \"template\": {
                    \"metadata\": {
                      \"annotations\": {
                        \"deploy.git.sha\": \"${SHA}\",
                        \"deploy.git.run\": \"https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"
                      }
                    }
                  }
                }
              }"
            done

            echo "[2-2] current images (sanity check)"
            for m in auth user product order coupon payment deposit settlement; do
              $K -n "$NS" get deploy "${m}" -o jsonpath='{.metadata.name}{" -> "}{.spec.template.spec.containers[0].image}{"\n"}'
            done

            echo "[3] wait rollout status"
            for m in auth user product order coupon payment deposit settlement; do
              $K -n "$NS" rollout status "deploy/${m}" --timeout=180s
            done

            echo "[4] result"
            $K -n "$NS" get deploy -o wide

            echo "[4-1] rollout history"
            for m in auth user product order coupon payment deposit settlement; do
              echo "=== ${m} ==="
              $K -n "$NS" rollout history "deploy/${m}" || true
            done
