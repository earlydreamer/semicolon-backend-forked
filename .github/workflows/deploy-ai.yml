name: Deploy to k3s (EC2)

on:
  push:
    branches: [ "dev" ]
  workflow_dispatch:

env:
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  EC2_HOST: ${{ secrets.EC2_HOST }}
  EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
  EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
  K8S_NAMESPACE: semicolon

jobs:
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      any_changed: ${{ steps.filter.outputs.any_changed }}
      changed_modules: ${{ steps.filter.outputs.changes }}
      all_modules: '["auth", "user", "product", "order", "coupon", "payment", "deposit", "settlement", "ai"]'
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Check for file changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            common:
              - 'common/**'
              - 'Dockerfile'
              - '.dockerignore'
              - 'gradlew'
              - 'gradle/**'
              - 'build.gradle'
              - 'settings.gradle'
              - '.github/workflows/deploy.yml'
            auth:
              - 'auth/**'
            user:
              - 'user/**'
            product:
              - 'product/**'
            order:
              - 'order/**'
            coupon:
              - 'coupon/**'
            payment:
              - 'payment/**'
            deposit:
              - 'deposit/**'
            settlement:
              - 'settlement/**'
            ai:
              - 'ai/**'

  build-and-push:
    needs: check-changes
    if: ${{ needs.check-changes.outputs.changed_modules != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # common 모듈 변경 여부에 따른 동적 매트릭스 구성
        module: ${{ contains(needs.check-changes.outputs.changed_modules, 'common') && fromJSON(needs.check-changes.outputs.all_modules) || fromJSON(needs.check-changes.outputs.changed_modules) }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push (sha + latest)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_USERNAME }}/semicolon-${{ matrix.module }}:${{ github.sha }}
            ${{ env.DOCKER_USERNAME }}/semicolon-${{ matrix.module }}:latest
          build-args: |
            MODULE_NAME=${{ matrix.module }}
          cache-from: type=gha,scope=${{ matrix.module }}
          cache-to: type=gha,mode=max,scope=${{ matrix.module }}

  deploy:
    needs: [check-changes, build-and-push]
    if: ${{ always() && needs.check-changes.outputs.changed_modules != '[]' && (needs.build-and-push.result == 'success' || needs.build-and-push.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2 (k3s) via SSH - set image by sha
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.EC2_HOST }}
          username: ${{ env.EC2_USERNAME }}
          key: ${{ env.EC2_SSH_KEY }}
          port: 22
          command_timeout: 30m
          script: |
            set -euo pipefail
  
            NS="${{ env.K8S_NAMESPACE }}"
            SHA="${{ github.sha }}"
            DOCKER_USERNAME="${{ env.DOCKER_USERNAME }}"
            K="sudo kubectl"
            
            REPO="${{ github.repository }}"
            RUN_ID="${{ github.run_id }}"
            
            # 배포 대상 모듈 결정
            CHANGED_MODS='${{ needs.check-changes.outputs.changed_modules }}'
            if [[ "$CHANGED_MODS" == *"common"* ]]; then
              MODS="auth user product order coupon payment deposit settlement ai"
            else
              # JSON 배열 포맷(["auth","user"])을 공백 구분자 포맷(auth user)으로 변환
              MODS=$(echo $CHANGED_MODS | jq -r '. | join(" ")')
            fi
            
            echo "Target Modules: $MODS"
            
            echo "[1] Pre-Cleanup: Remove dangling containers"
            docker container prune -f || true
            
            echo "[2] cluster check"
            $K -n "$NS" get deploy -o wide
          
            echo "[3] rollout sequential (Resource-Saving Mode): scale 0 -> set image -> scale 1 -> wait"
            for m in $MODS; do
              # common은 배포 대상이 아님
              if [ "$m" == "common" ]; then continue; fi
              
              img="${DOCKER_USERNAME}/semicolon-${m}:${SHA}"
              echo ">>> Deploying ${m} (Image: ${img}) <<<"
            
              # [순차 기동 핵심] 자원 겹침을 방지하기 위해 기존 Pod를 먼저 완전히 종료
              echo " - Scaling down ${m} to 0..."
              $K -n "$NS" scale deploy/${m} --replicas=0
              sleep 5
            
              # 이미지 및 어노테이션 업데이트
              echo " - Updating image and metadata..."
              $K -n "$NS" set image "deploy/${m}" "${m}=${img}"
              
              # [설정 동기화] K8s 클러스터의 Probe 설정을 코드 사양에 맞게 강제 업데이트
              echo " - Patching health probes for stability..."
              $K -n "$NS" patch deploy/${m} --type='json' -p='[
                {"op": "replace", "path": "/spec/template/spec/containers/0/livenessProbe/timeoutSeconds", "value": 5},
                {"op": "replace", "path": "/spec/template/spec/containers/0/readinessProbe/timeoutSeconds", "value": 5},
                {"op": "replace", "path": "/spec/template/spec/containers/0/livenessProbe/initialDelaySeconds", "value": 150},
                {"op": "replace", "path": "/spec/template/spec/containers/0/readinessProbe/initialDelaySeconds", "value": 40},
                {"op": "replace", "path": "/spec/template/spec/containers/0/livenessProbe/failureThreshold", "value": 5},
                {"op": "replace", "path": "/spec/template/spec/containers/0/readinessProbe/failureThreshold", "value": 5}
              ]' || true

              $K -n "$NS" patch "deploy/${m}" -p "{
                \"spec\": {
                  \"template\": {
                    \"metadata\": {
                      \"annotations\": {
                        \"deploy.git.sha\": \"${SHA}\",
                        \"deploy.git.repo\": \"${REPO}\",
                        \"deploy.git.run\": \"https://github.com/${REPO}/actions/runs/${RUN_ID}\"
                      }
                    }
                  }
                }
              }"
            
              # 새 버전 기동
              echo " - Scaling up ${m} to 1..."
              $K -n "$NS" scale deploy/${m} --replicas=1
            
              # 완전히 뜰 때까지 대기
              echo " - Waiting for ${m} to be ready..."
              $K -n "$NS" rollout status "deploy/${m}" --timeout=600s
              
              # 서버 부하 전이를 막기 위한 짧은 안정화 시간
              echo " - Wait 10s for stability..."
              sleep 10
            done
            
            echo "[3] current images (sanity check)"
            for m in $MODS; do
              if [ "$m" == "common" ]; then continue; fi
              $K -n "$NS" get deploy "${m}" -o jsonpath='{.metadata.name}{" -> "}{.spec.template.spec.containers[0].image}{"\n"}'
            done
            
            echo "[4] result"
            $K -n "$NS" get deploy -o wide
            $K -n "$NS" get pods -o wide
            $K -n "$NS" get rs -o wide
            
            echo "[6] Post-Cleanup: Remove unused images"
            docker image prune -f || true
            
            echo "Done!"
