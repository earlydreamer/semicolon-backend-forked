# payment 서비스의 기본 실행 설정입니다.
server:
  port: 8086

spring:
  config:
    import: classpath:application-common.yml
  application:
    name: payment

  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:payment_service}?sslmode=${DB_SSLMODE:disable}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

toss:
  callback:
    base-url: ${TOSS_CALLBACK_BASE_URL:https://dukku.earlydreamer.dev}
