server:
  port: 8086

spring:
  config:
    import: classpath:application-common.yml
  application:
    name: payment

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:payment_service}?sslmode=${DB_SSLMODE:disable}

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration/payment

  jpa:
    hibernate:
      ddl-auto: validate

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

  jpa:
    hibernate:
      ddl-auto: validate

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

jwt:
  access:
    secret:
      key: ${JWT_ACCESS_SECRET}
  refresh:
    secret:
      key: ${JWT_REFRESH_SECRET}

crypto:
  key: ${CRYPTO_KEY}

slack:
  webhook:
    url: ${SLACK_WEBHOOK_URL}

custom:
  global:
    internalBackUrl: ${INTERNAL_BACK_URL}
  security:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,https://localhost:3000}
