spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:semicolon}?sslmode=disable
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:semicolon1234}
  jpa:
    properties:
      hibernate:
        hbm2ddl:
          auto: create-drop
        dialect: org.hibernate.dialect.PostgreSQLDialect
  kafka:
    listener:
      auto-startup: false
    bootstrap-servers: localhost:9092
  data:
    redis:
      host: localhost
      port: 6379
  main:
    allow-bean-definition-overriding: true

jwt:
  access:
    secret:
      key: dGhpcy1rZXktaXMtdGVzdC1rZXktYWNjZXNzLTAxMjM=
  refresh:
    secret:
      key: dGhpcy1rZXktaXMtdGVzdC1rZXktcmVmcmVzaC0wMTI=
crypto:
  key: dGhpcy1rZXktaXMtdGVzdC1rZXktY3J5cHRvLTAxMjM=
