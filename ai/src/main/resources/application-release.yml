# AI 서비스의 release 프로필 전용 설정입니다.
ai:
  init:
    enabled: ${AI_INIT_ENABLED:true}

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:ai_service}?sslmode=${DB_SSLMODE:disable}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: ${OPENAI_CHAT_MODEL:gpt-4o-mini}
    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: always

  jpa:
    hibernate:
      ddl-auto: update

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

jwt:
  access:
    secret:
      key: ${JWT_ACCESS_SECRET}

crypto:
  key: ${CRYPTO_KEY}

custom:
  security:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost,https://localhost,http://127.0.0.1,https://127.0.0.1,http://localhost:3000,https://localhost:3000,http://127.0.0.1:3000,https://127.0.0.1:3000,http://localhost:5173,https://localhost:5173,http://127.0.0.1:5173,https://127.0.0.1:5173,https://${PUBLIC_WEB_HOST:dukku.earlydreamer.dev},https://www.${PUBLIC_WEB_HOST:dukku.earlydreamer.dev}}
