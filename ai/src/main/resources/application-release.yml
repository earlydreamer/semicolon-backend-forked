ai:
  init:
    enabled: ${AI_INIT_ENABLED:true}

spring:
  datasource:
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: ${OPENAI_CHAT_MODEL:gpt-4o-mini}

  jpa:
    hibernate:
      ddl-auto: update

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

jwt:
  access:
    secret:
      key: ${JWT_ACCESS_SECRET}

crypto:
  key: ${CRYPTO_KEY}

custom:
  security:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,https://localhost:3000}
