# AI 서비스의 기본 실행 설정입니다.
server:
  port: 8089

spring:
  config:
    import: classpath:application-common.yml
  application:
    name: ai

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:ai_service}?sslmode=${DB_SSLMODE:disable}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        show_sql: true
        format_sql: true
        use_sql_comments: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: Asia/Seoul
  ai:
    model:
      chat: google-genai
      # EmbeddingModel starter의 taskType 미전송 때문에 AI 모듈의 GeminiEmbeddingService를 사용한다.
      embedding:
        text: none
    google:
      genai:
        api-key: ${GEMINI_API_KEY:sk-dummy}
        chat:
          model: ${CHAT_MODEL:gemini-3.5-flash-lite}
          temperature: 0.7
          include-thoughts: true
    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: always
ai:
  init:
    enabled: ${AI_INIT_ENABLED:true}
  embedding:
    model: ${EMBEDDING_MODEL:gemini-embedding-001}
    dimensions: 1536

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        spring.ai: true
        gen_ai: true
        db.vector: true
