# AI 서비스의 기본 실행 설정입니다.
server:
  port: 8089

spring:
  config:
    import: classpath:application-common.yml
  application:
    name: ai

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:ai_service}?sslmode=${DB_SSLMODE:disable}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        show_sql: true
        format_sql: true
        use_sql_comments: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: Asia/Seoul
  ai:
    openai:
      base-url: https://generativelanguage.googleapis.com/v1beta/openai/
      api-key: ${GEMINI_API_KEY:sk-dummy}
      chat:
        model: ${CHAT_MODEL:gemini-2.5-flash-lite}
        temperature: 0.7
      embedding:
        dimensions: 1536
        model: ${EMBEDDING_MODEL:gemini-embedding-001}
    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: always
ai:
  init:
    enabled: ${AI_INIT_ENABLED:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        spring.ai: true
        gen_ai: true
        db.vector: true
