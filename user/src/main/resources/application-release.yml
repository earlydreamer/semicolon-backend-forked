spring:
  datasource:
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

jwt:
  access:
    secret:
      key: ${JWT_ACCESS_SECRET}

crypto:
  key: ${CRYPTO_KEY}

custom:
  email:
    verification:
      base-url: ${EMAIL_VERIFICATION_BASE_URL}
      success-redirect-url: ${EMAIL_VERIFICATION_SUCCESS_REDIRECT_URL}
  security:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost,https://localhost,http://localhost:3000,https://localhost:3000}
