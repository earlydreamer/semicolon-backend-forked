# user 서비스의 기본 실행 설정입니다.
server:
  port: 8082

spring:
  config:
    import: classpath:application-common.yml
  application:
    name: user

  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:user_service}?sslmode=${DB_SSLMODE:disable}

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${EMAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    prometheus:
      enabled: true
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

custom:
  email:
    verification:
      required: true
      base-url: ${EMAIL_VERIFICATION_BASE_URL:https://${PUBLIC_API_HOST:api-dukku.earlydreamer.dev}}
      success-redirect-url: ${EMAIL_VERIFICATION_SUCCESS_REDIRECT_URL:https://${PUBLIC_WEB_HOST:dukku.earlydreamer.dev}/email/verify}
      token-ttl-seconds: ${EMAIL_VERIFICATION_TOKEN_TTL_SECONDS:1800}
      verified-ttl-seconds: ${EMAIL_VERIFICATION_VERIFIED_TTL_SECONDS:1800}
      result-token-ttl-seconds: ${EMAIL_VERIFICATION_RESULT_TOKEN_TTL_SECONDS:300}
  signup:
    request-lock-ttl-seconds: 10
    idempotency:
      in-progress-ttl-seconds: 30
      completed-ttl-seconds: 1800
