apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: seaweedfs-pvc
  namespace: semicolon
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seaweedfs
  namespace: semicolon
spec:
  replicas: 1
  selector:
    matchLabels:
      app: seaweedfs
  template:
    metadata:
      labels:
        app: seaweedfs
    spec:
      # OBJECT_STORAGE_ACCESS_KEY / SECRET_KEY 로 s3.json 동적 생성
      initContainers:
        - name: gen-s3-config
          image: busybox:latest
          env:
            - name: ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: semicolon-env
                  key: OBJECT_STORAGE_ACCESS_KEY
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: semicolon-env
                  key: OBJECT_STORAGE_SECRET_KEY
          command:
            - sh
            - -c
            - |
              printf '{"identities":[{"name":"admin","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List"]}]}' \
                "$ACCESS_KEY" "$SECRET_KEY" > /config/s3.json
          volumeMounts:
            - name: s3-config
              mountPath: /config
      containers:
        - name: seaweedfs
          image: chrislusf/seaweedfs:latest
          command:
            - weed
            - server
            - -dir=/data
            - -filer
            - -s3
            - -s3.port=8333
            - -s3.config=/config/s3.json
          ports:
            - containerPort: 9333
              name: master
            - containerPort: 8080
              name: volume
            - containerPort: 8888
              name: filer
            - containerPort: 8333
              name: s3-api
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: seaweedfs-storage
              mountPath: /data
            - name: s3-config
              mountPath: /config
          livenessProbe:
            tcpSocket:
              port: 9333
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
          readinessProbe:
            tcpSocket:
              port: 8333
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
      volumes:
        - name: seaweedfs-storage
          persistentVolumeClaim:
            claimName: seaweedfs-pvc
        - name: s3-config
          emptyDir: {}

---
# S3 API(8333): 클러스터 내부 통신 + Ingress 경유 외부 노출
# Master(9333) / Filer(8888): 클러스터 내부 전용
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs-service
  namespace: semicolon
spec:
  selector:
    app: seaweedfs
  ports:
    - name: s3-api
      port: 8333
      targetPort: 8333
    - name: master
      port: 9333
      targetPort: 9333
    - name: filer
      port: 8888
      targetPort: 8888
