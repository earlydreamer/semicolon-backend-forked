apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: semicolon
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-scripts
  namespace: semicolon
data:
  db-common.lib: |
    #!/bin/sh
    set -eu

    DATABASES="${SHOWCASE_DATABASES:-ai_service auth_service user_service product_service order_service payment_service deposit_service coupon_service settlement_service}"

    validate_database_name() {
        db="$1"

        case "$db" in
            ""|*[!abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789_]*)
                echo "Invalid database name: $db" >&2
                exit 1
                ;;
        esac
    }

    database_exists() {
        db="$1"
        validate_database_name "$db"

        psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname postgres -tAc \
            "SELECT 1 FROM pg_database WHERE datname = '$db'" | grep -q 1
    }

    create_database_if_missing() {
        db="$1"
        validate_database_name "$db"

        if database_exists "$db"; then
            echo "Database already exists: $db"
            return 0
        fi

        echo "Creating database: $db"
        psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname postgres -c "CREATE DATABASE $db"
    }

    drop_database_if_exists() {
        db="$1"
        validate_database_name "$db"

        if ! database_exists "$db"; then
            echo "Database already absent: $db"
            return 0
        fi

        echo "Dropping database: $db"
        psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname postgres <<EOSQL
    SELECT pg_terminate_backend(pid)
    FROM pg_stat_activity
    WHERE datname = '$db'
      AND pid <> pg_backend_pid();
    DROP DATABASE IF EXISTS $db;
    EOSQL
    }

    recreate_database() {
        db="$1"
        drop_database_if_exists "$db"
        create_database_if_missing "$db"
    }

    install_extensions() {
        db="$1"
        validate_database_name "$db"

        echo "Installing extensions on: $db"
        psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$db" <<EOSQL
    CREATE EXTENSION IF NOT EXISTS vector;
    CREATE EXTENSION IF NOT EXISTS pgroonga;
    EOSQL
    }

    initialize_showcase_databases() {
        for db in $DATABASES; do
            create_database_if_missing "$db"
            install_extensions "$db"
        done

        echo "All showcase databases initialized successfully."
    }

    reset_showcase_databases() {
        for db in $DATABASES; do
            recreate_database "$db"
            install_extensions "$db"
        done

        echo "All showcase databases reset successfully."
    }
  init-databases.sh: |
    #!/bin/sh
    set -eu

    SCRIPT_DIR=$(CDPATH= cd -- "$(dirname "$0")" && pwd)
    . "$SCRIPT_DIR/db-common.lib"

    initialize_showcase_databases
  reset-databases.sh: |
    #!/bin/sh
    set -eu

    SCRIPT_DIR=$(CDPATH= cd -- "$(dirname "$0")" && pwd)
    . "$SCRIPT_DIR/db-common.lib"

    reset_showcase_databases

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: semicolon
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: dukku/semicolon-postgres:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
              protocol: TCP
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: semicolon-env
                  key: DB_USERNAME
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: semicolon-env
                  key: DB_PASSWORD
            - name: POSTGRES_DB
              value: postgres
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
            - name: postgres-init-scripts
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
            - name: postgres-ops-scripts
              mountPath: /opt/postgres
              readOnly: true
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - pg_isready -U "$POSTGRES_USER" -d postgres
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - pg_isready -U "$POSTGRES_USER" -d postgres
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: postgres-pvc
        - name: postgres-init-scripts
          configMap:
            name: postgres-scripts
            defaultMode: 0755
            items:
              - key: db-common.lib
                path: db-common.lib
              - key: init-databases.sh
                path: 01-init-databases.sh
        - name: postgres-ops-scripts
          configMap:
            name: postgres-scripts
            defaultMode: 0755

---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: semicolon
spec:
  selector:
    app: postgres
  ports:
    - name: tcp
      port: 5432
      targetPort: 5432

---
apiVersion: v1
kind: Service
metadata:
  name: postgresql
  namespace: semicolon
spec:
  selector:
    app: postgres
  ports:
    - name: tcp
      port: 5432
      targetPort: 5432
