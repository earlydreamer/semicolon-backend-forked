apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-gateway-ingress
  namespace: semicolon
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /api/v1/auth
            pathType: Prefix
            backend:
              service:
                name: auth-service
                port:
                  number: 80
          - path: /api/v1/admin/auth
            pathType: Prefix
            backend:
              service:
                name: auth-service
                port:
                  number: 80
          - path: /oauth2/
            pathType: Prefix
            backend:
              service:
                name: auth-service
                port:
                  number: 80
          - path: /login/oauth2/
            pathType: Prefix
            backend:
              service:
                name: auth-service
                port:
                  number: 80
          - path: /api/v1/users
            pathType: Prefix
            backend:
              service:
                name: user-service
                port:
                  number: 80
          - path: /api/v1/products
            pathType: Prefix
            backend:
              service:
                name: product-service
                port:
                  number: 80
          - path: /api/v1/categories
            pathType: Prefix
            backend:
              service:
                name: product-service
                port:
                  number: 80
          - path: /api/v1/carts
            pathType: Prefix
            backend:
              service:
                name: product-service
                port:
                  number: 80
          - path: /api/v1/sellers
            pathType: Prefix
            backend:
              service:
                name: product-service
                port:
                  number: 80
          - path: /api/v1/shops
            pathType: Prefix
            backend:
              service:
                name: product-service
                port:
                  number: 80
          - path: /api/v1/seller-reviews
            pathType: Prefix
            backend:
              service:
                name: product-service
                port:
                  number: 80
          - path: /api/v1/seller/products
            pathType: Prefix
            backend:
              service:
                name: product-service
                port:
                  number: 80
          - path: /api/v1/orders
            pathType: Prefix
            backend:
              service:
                name: order-service
                port:
                  number: 80
          - path: /api/v1/returns
            pathType: Prefix
            backend:
              service:
                name: order-service
                port:
                  number: 80
          - path: /api/v1/payments
            pathType: Prefix
            backend:
              service:
                name: payment-service
                port:
                  number: 80
          - path: /api/v1/coupons
            pathType: Prefix
            backend:
              service:
                name: coupon-service
                port:
                  number: 80
          - path: /api/v1/deposits
            pathType: Prefix
            backend:
              service:
                name: deposit-service
                port:
                  number: 80
          - path: /api/v1/settlements
            pathType: Prefix
            backend:
              service:
                name: settlement-service
                port:
                  number: 80
          - path: /api/v1/ai
            pathType: Prefix
            backend:
              service:
                name: ai-service
                port:
                  number: 80
          - path: /api/v1/logs
            pathType: Prefix
            backend:
              service:
                name: log-consumer-service
                port:
                  number: 80
          - path: /api/v1/anomalies
            pathType: Prefix
            backend:
              service:
                name: log-consumer-service
                port:
                  number: 80
          - path: /api/v1/admin/users
            pathType: Prefix
            backend:
              service:
                name: user-service
                port:
                  number: 80
          - path: /api/v1/admin/products
            pathType: Prefix
            backend:
              service:
                name: product-service
                port:
                  number: 80
          - path: /api/v1/admin/orders
            pathType: Prefix
            backend:
              service:
                name: order-service
                port:
                  number: 80
          - path: /api/v1/admin/payments
            pathType: Prefix
            backend:
              service:
                name: payment-service
                port:
                  number: 80
          - path: /api/v1/admin/coupons
            pathType: Prefix
            backend:
              service:
                name: coupon-service
                port:
                  number: 80
          - path: /api/v1/admin/deposits
            pathType: Prefix
            backend:
              service:
                name: deposit-service
                port:
                  number: 80
          - path: /api/v1/admin/settlements
            pathType: Prefix
            backend:
              service:
                name: settlement-service
                port:
                  number: 80
