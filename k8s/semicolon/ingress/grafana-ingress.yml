# 운영 Grafana 공개 도메인을 grafana-service로 라우팅하는 인그레스입니다.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana-ingress
  namespace: semicolon
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - ${PUBLIC_GRAFANA_HOST}
      secretName: ${PUBLIC_GRAFANA_TLS_SECRET}
  rules:
    - host: ${PUBLIC_GRAFANA_HOST}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: grafana-service
                port:
                  number: 3000
