# Cloudflare Tunnel의 로컬 HTTP 엔트리포인트에서 Grafana 공개 호스트를 받기 위한 인그레스입니다.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana-ingress
  namespace: semicolon
spec:
  ingressClassName: traefik
  rules:
    - host: ${PUBLIC_GRAFANA_HOST}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: grafana-service
                port:
                  number: 3000
