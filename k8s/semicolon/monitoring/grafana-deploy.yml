apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: semicolon
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:latest
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: semicolon-env
          env:
            - name: GF_SECURITY_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: semicolon-env
                  key: GRAFANA_ADMIN_USER
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: semicolon-env
                  key: GRAFANA_ADMIN_PASSWORD
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: "Viewer"
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
            - name: GF_DATE_FORMATS_DEFAULT_TIMEZONE
              value: "Asia/Seoul"
            - name: GF_FEATURE_TOGGLES_ENABLE
              value: "publicDashboards"
            - name: GF_SECURITY_ALLOW_EMBEDDING
              value: "true"
            - name: GF_INSTALL_PLUGINS
              value: "yesoreyeram-infinity-datasource"
          volumeMounts:
            - name: grafana-storage
              mountPath: /var/lib/grafana
      volumes:
        - name: grafana-storage
          emptyDir: {} # TODO: 실운영 시 PVC로 교체 권장

---
apiVersion: v1
kind: Service
metadata:
  name: grafana-service
  namespace: semicolon
spec:
  selector:
    app: grafana
  ports:
    - port: 3000
      targetPort: 3000
