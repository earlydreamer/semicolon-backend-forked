apiVersion: apps/v1
kind: Deployment
metadata:
  name: settlement
  namespace: semicolon
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: settlement
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/restartedAt: "2026-02-18T05:16:37+09:00"
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "8088"
      labels:
        app: settlement
    spec:
      containers:
        - envFrom:
            - secretRef:
                name: semicolon-env
            - secretRef:
                name: settlement-db
                optional: true
          image: dukku/semicolon-settlement:latest
          imagePullPolicy: Always
          name: settlement
          ports:
            - containerPort: 8088
              protocol: TCP
          resources:
            limits:
              cpu: 600m
              memory: 640Mi
            requests:
              cpu: 50m
              memory: 384Mi
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-Xmx384m"
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8088
            initialDelaySeconds: 150
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8088
            initialDelaySeconds: 40
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
