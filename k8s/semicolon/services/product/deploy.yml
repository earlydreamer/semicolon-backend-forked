apiVersion: apps/v1
kind: Deployment
metadata:
  name: product
  namespace: semicolon
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: product
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: product
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "8083"
    spec:
      containers:
        - envFrom:
            - secretRef:
                name: semicolon-env
            - secretRef:
                name: product-db
                optional: true
          image: dukku/semicolon-product:latest
          imagePullPolicy: Always
          name: product
          ports:
            - containerPort: 8083
              protocol: TCP
          resources:
            limits:
              cpu: 1000m  # 珥덇린 援щ룞 ?띾룄瑜??꾪빐 CPU ?쒕룄 ?곹뼢
              memory: 640Mi
            requests:
              cpu: 200m
              memory: 384Mi
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-Xmx384m"
          # startupProbe瑜??ъ슜?섏뿬 ?깆씠 ?꾩쟾??耳쒖쭏 ?뚭퉴吏 湲곕떎由?          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8083
            failureThreshold: 30
            periodSeconds: 10 # 理쒕? 300珥??숈븞 援щ룞 ?湲?          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8083
            initialDelaySeconds: 10 # startupProbe ?깃났 ?꾨???泥댄겕
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8083
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      terminationGracePeriodSeconds: 30
