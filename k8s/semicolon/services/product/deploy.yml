apiVersion: apps/v1
kind: Deployment
metadata:
  name: product
  namespace: semicolon
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: product
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: product
    spec:
      containers:
        - envFrom:
            - secretRef:
                name: semicolon-env
            - secretRef:
                name: product-db
          image: dukku/semicolon-product:latest
          imagePullPolicy: IfNotPresent
          name: product
          ports:
            - containerPort: 8083
              protocol: TCP
          resources:
            limits:
              cpu: 1000m  # 초기 구동 속도를 위해 CPU 한도 상향
              memory: 640Mi
            requests:
              cpu: 200m
              memory: 384Mi
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-Xmx384m"
          # startupProbe를 사용하여 앱이 완전히 켜질 때까지 기다림
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8083
            failureThreshold: 30
            periodSeconds: 10 # 최대 300초 동안 구동 대기
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8083
            initialDelaySeconds: 10 # startupProbe 성공 후부터 체크
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8083
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      terminationGracePeriodSeconds: 30