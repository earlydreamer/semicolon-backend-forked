apiVersion: apps/v1
kind: Deployment
metadata:
  name: order
  namespace: semicolon
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: order
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/restartedAt: "2026-02-18T05:16:37+09:00"
      labels:
        app: order
    spec:
      containers:
        - envFrom:
            - secretRef:
                name: semicolon-env
            - secretRef:
                name: order-db
          image: hwangslater/semicolon-order:latest
          imagePullPolicy: Always
          name: order
          ports:
            - containerPort: 8084
              protocol: TCP
          resources:
            limits:
              cpu: 600m
              memory: 768Mi
            requests:
              cpu: 50m
              memory: 256Mi
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
