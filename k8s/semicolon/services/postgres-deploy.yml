apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: semicolon
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi # 로컬 환경 메모리 절약을 위해 최소 사양
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: semicolon
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        # pgvector와 pgroonga가 포함된 이미지를 사용하거나, 
        # 프로젝트 내 Dockerfile로 수동 빌드한 이미지를 사용하는 것이 정석입니다.
        # 여기서는 가장 안정적인 pgvector 공식 이미지를 사용합니다.
        image: pgvector/pgvector:pg17 
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_USER
          value: postgres
        - name: POSTGRES_PASSWORD
          value: postgres
        - name: POSTGRES_DB
          value: postgres
        volumeMounts:
        - name: postgres-storage
          mountPath: /var/lib/postgresql/data
      volumes:
      - name: postgres-storage
        persistentVolumeClaim:
          claimName: postgres-pvc
