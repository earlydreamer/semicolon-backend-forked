apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: semicolon
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi # 로컬 환경 메모리 절약을 위해 최소 사양
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-scripts
  namespace: semicolon
data:
  init-databases.sh: |
    #!/bin/bash
    set -e

    DATABASES="ai_service auth_service user_service product_service order_service payment_service deposit_service coupon_service settlement_service"

    for DB in $DATABASES; do
        echo "Creating database: $DB"
        psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" <<-EOSQL
            CREATE DATABASE $DB;
    EOSQL

        echo "Installing extensions on: $DB"
        psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$DB" <<-EOSQL
            CREATE EXTENSION IF NOT EXISTS vector;
            CREATE EXTENSION IF NOT EXISTS pgroonga;
    EOSQL
    done

    echo "All databases and extensions created successfully."
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: semicolon
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        # PGroonga + pgvector 커스텀 이미지 (postgres/Dockerfile에서 빌드)
        # 빌드: docker build -t <DOCKER_USERNAME>/semicolon-postgres:latest ./postgres
        # 푸시: docker push <DOCKER_USERNAME>/semicolon-postgres:latest
        image: dukku/semicolon-postgres:latest
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_USER
          value: postgres
        - name: POSTGRES_PASSWORD
          value: postgres
        - name: POSTGRES_DB
          value: postgres
        volumeMounts:
        - name: postgres-storage
          mountPath: /var/lib/postgresql/data
        - name: init-scripts
          mountPath: /docker-entrypoint-initdb.d
          readOnly: true
      volumes:
      - name: postgres-storage
        persistentVolumeClaim:
          claimName: postgres-pvc
      - name: init-scripts
        configMap:
          name: postgres-init-scripts
          defaultMode: 0755
