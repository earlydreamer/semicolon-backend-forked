# Prometheus + Grafana 모니터링 스택
# 사용법: docker-compose up -d (monitoring 폴더에서 실행)
version: "3.8"

services:
  # Prometheus - 메트릭 수집 및 저장
  prometheus:
    image: prom/prometheus:latest
    container_name: semicolon-prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'  # 30일간 데이터 보관
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    restart: unless-stopped
    networks:
      - monitoring
    extra_hosts:
      - "host.docker.internal:host-gateway"  # Linux에서도 작동하도록 설정

  # Grafana - 메트릭 시각화 대시보드
  grafana:
    image: grafana/grafana:latest
    container_name: semicolon-grafana
    environment:
      # 기본 관리자 계정 (운영 환경에서는 반드시 변경!)
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      # 익명 접근 허용 (개발용)
      - GF_AUTH_ANONYMOUS_ENABLED=false
      # 기본 조직 설정
      - GF_USERS_ALLOW_SIGN_UP=false
      # 시간대 설정
      - GF_DATE_FORMATS_DEFAULT_TIMEZONE=Asia/Seoul
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    restart: unless-stopped
    networks:
      - monitoring
    depends_on:
      - prometheus

# 영구 볼륨 정의
volumes:
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

# 네트워크 정의
networks:
  monitoring:
    driver: bridge
