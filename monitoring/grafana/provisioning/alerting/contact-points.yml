# Grafana Alert Contact Points Provisioning
# Slack Incoming Webhook을 통한 알림 전송 설정
# .env 파일의 SLACK_WEB_HOOK_GRAFANA_ERROR 환경변수를 참조합니다.
# recipient는 Grafana validation 필수 필드이나, Incoming Webhook 사용 시 실제 전송 채널은 webhook URL이 결정합니다.
apiVersion: 1

contactPoints:
  - orgId: 1
    name: "Slack Error Alerts"
    receivers:
      - uid: "slack-error-notification"
        type: "slack"
        settings:
          url: ${SLACK_WEBHOOK_URL_GRAFANA_ERROR}
          recipient: "#grafana-alerts"
          title: "[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}"
          text: |
            *Service:* {{ .CommonLabels.service }}
            *Description:* {{ .CommonAnnotations.description }}
