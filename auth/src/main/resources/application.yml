spring:
  application:
    name: auth

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:auth_service}?sslmode=${DB_SSLMODE:disable}
    driver-class-name: org.postgresql.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 30
      idle-timeout: 30000
      connection-timeout: 30000
      max-lifetime: 1800000

  jpa:
    open-in-view: false
    properties:
      hibernate:
        show_sql: true              # 부하 테스트 시 반드시 false
        format_sql: false
        use_sql_comments: false

        hbm2ddl:
          auto: create

        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_batch_fetch_size: 100

        jdbc:
          time_zone: Asia/Seoul

  jackson:
    time-zone: Asia/Seoul
    serialization:
      fail-on-empty-beans: false

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: 1
      retries: 3
      properties:
        linger.ms: 100
        batch.size: 16384
        interceptor.classes: dukku.common.global.logging.KafkaTracingProducerInterceptor
    consumer:
      group-id: ${spring.application.name}-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest
      properties:
        interceptor.classes: dukku.common.global.logging.KafkaTracingConsumerInterceptor

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    url: /api-docs
    operations-sorter: method