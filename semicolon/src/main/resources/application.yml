spring:
  application:
    name: semicolon

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:user_service}?sslmode=${DB_SSLMODE:disable}
    driver-class-name: org.postgresql.Driver

    hikari:
      # 🔑 Tomcat max-threads 대비 1:1 이하 유지
      minimum-idle: 20
      maximum-pool-size: 200

      # 커넥션을 오래 붙잡지 않도록
      idle-timeout: 30000
      max-lifetime: 1800000

      # 부하 시 빠른 실패 (스레드 고착 방지)
      connection-timeout: 3000

      validation-timeout: 2000
      leak-detection-threshold: 2000

  jpa:
    open-in-view: false
    properties:
      hibernate:
        show_sql: false              # 부하 테스트 시 반드시 false
        format_sql: false
        use_sql_comments: false

        hbm2ddl:
          auto: update

        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_batch_fetch_size: 100

        jdbc:
          time_zone: Asia/Seoul

  jackson:
    time-zone: Asia/Seoul
    serialization:
      fail-on-empty-beans: false

  batch:
    jdbc:
      initialize-schema: always
    job:
      enabled: false

  elasticsearch:
    uris: http://localhost:9200
    socket-timeout: 30s
    connection-timeout: 5s

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    url: /api-docs
    operations-sorter: method

server:
  port: 8080
  forward-headers-strategy: framework

  tomcat:
    threads:
      min-spare: 50
      max: 300        # ⚠️ 1000 VU ≠ 1000 threads
    accept-count: 500 # 대기 큐 확장 (빠른 실패 방지)

    max-connections: 1000
    connection-timeout: 2000

    keep-alive-timeout: 15000
    max-keep-alive-requests: 100

    accesslog:
      enabled: true
      pattern: "%h %l %u %t \"%r\" %s %b %D"

# =========================================================
# Redis / Custom / Batch
# =========================================================
redis:
  product:
    view:
      prefix: "product:view:"
      dirty-key: "product:view:dirty"

custom:
  email:
    verification:
      required: true
      base-url: ${EMAIL_VERIFICATION_BASE_URL:http://localhost:8080}
      token-ttl-seconds: ${EMAIL_VERIFICATION_TOKEN_TTL_SECONDS:1800}
      verified-ttl-seconds: ${EMAIL_VERIFICATION_VERIFIED_TTL_SECONDS:1800}

  user:
    withdrawal:
      restore-days: 30
      purge-days: 90
      purge-cron: "0 0 3 * * *"
      mask-domain: "withdrawn.invalid"

system:
  admin-deposit:
    password: ${SYSTEM_DEPOSIT_PASSWORD}

batch:
  settlement:
    chunk-size: 100
    fee-rate: 0.05
    skip-limit: 10
    retry-limit: 3
    page-size: 100
    scheduler:
      enabled: true
      cron: "0 0 2 1 * *" # 매월 1일 오전 2시 실행
