# 해당 파일은 로컬에서 실행하기위해 필요한 앱을 설치하는 파일입니다. Elasticsearch, Redis.
# 개발용을 위해 만들어졌으며 배포시에는 사용을 안합니다.

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.2.2
    container_name: semicolon-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "${LOCAL_ES_PORT:-19200}:9200"

  redis:
    image: redis:7.2
    container_name: semicolon-redis
    ports:
      - "${LOCAL_REDIS_PORT:-16379}:6379"

  postgresql:
    build:
      context: postgres
      dockerfile: Dockerfile
    container_name: semicolon-postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME:-semicolon}
    ports:
      - "${LOCAL_DB_PORT:-15432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init-databases.sh:/docker-entrypoint-initdb.d/01-init-databases.sh
    restart: unless-stopped

volumes:
  pgdata:
