# 해당 파일은 로컬에서 실행하기위해 필요한 앱을 설치하는 파일입니다. Elasticsearch, Redis.
# 개발용을 위해 만들어졌으며 배포시에는 사용을 안합니다.

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.2.2
    container_name: team05-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    # 플러그인 설치 명령어 (그대로 유지)
    command: >
      /bin/sh -c "
        if ! ./bin/elasticsearch-plugin list | grep -q analysis-nori; then
          ./bin/elasticsearch-plugin install analysis-nori;
        fi;
        /usr/local/bin/docker-entrypoint.sh elasticsearch
      "
  redis:
    image: redis:7.2
    container_name: team05-redis
    ports:
      - "6379:6379"

  postgresql:
    build:
      context: postgres
      dockerfile: Dockerfile
    container_name: team05-postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=P@ssw0rd
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./postgres/init-databases.sh:/docker-entrypoint-initdb.d/01-init-databases.sh
    restart: unless-stopped

volumes:
  pgdata:
