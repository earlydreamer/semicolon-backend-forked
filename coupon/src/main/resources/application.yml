spring:
  application:
    name: coupon

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:coupon_service}?sslmode=${DB_SSLMODE:disable}
    driver-class-name: org.postgresql.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 30
      idle-timeout: 30000
      connection-timeout: 30000
      max-lifetime: 1800000

  jpa:
    open-in-view: false
    properties:
      hibernate:
        show_sql: true              # 부하 테스트 시 반드시 false
        format_sql: false
        use_sql_comments: false

        hbm2ddl:
          auto: create

        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_batch_fetch_size: 100

        jdbc:
          time_zone: Asia/Seoul

  jackson:
    time-zone: Asia/Seoul
    serialization:
      fail-on-empty-beans: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    url: /api-docs
    operations-sorter: method