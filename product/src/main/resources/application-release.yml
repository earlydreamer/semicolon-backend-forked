# product 서비스의 release 프로필 전용 설정입니다.
spring:
  kafka:
    listener:
      auto-startup: true
  datasource:
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update

product:
  init:
    enabled: ${PRODUCT_INIT_ENABLED:false}
    clear-es-on-startup: ${PRODUCT_INIT_CLEAR_ES_ON_STARTUP:false}
  reindex-on-startup: ${PRODUCT_REINDEX_ON_STARTUP:false}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

jwt:
  access:
    secret:
      key: ${JWT_ACCESS_SECRET}

crypto:
  key: ${CRYPTO_KEY}

custom:
  security:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost,https://localhost,http://127.0.0.1,https://127.0.0.1,http://localhost:3000,https://localhost:3000,http://127.0.0.1:3000,https://127.0.0.1:3000,http://localhost:5173,https://localhost:5173,http://127.0.0.1:5173,https://127.0.0.1:5173,https://dukku.earlydreamer.dev,https://www.dukku.earlydreamer.dev}

cloud:
  aws:
    credentials:
      access-key: ${AWS_ACCESS_KEY}
      secret-key: ${AWS_SECRET_KEY}
    region:
      static: ${AWS_REGION}
    s3:
      bucket: ${AWS_S3_BUCKET}
