# product 서비스의 기본 실행 설정입니다. (Cloudflare R2 오브젝트 스토리지 사용)
server:
  port: 8083

spring:
  config:
    import: classpath:application-common.yml
  application:
    name: product
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:product_service}?sslmode=${DB_SSLMODE:disable}

  batch:
    jdbc:
      initialize-schema: always
    job:
      enabled: false

  elasticsearch:
    uris: ${ELASTICSEARCH_URL:http://elasticsearch:9200}
    socket-timeout: 30s
    connection-timeout: 5s
  kafka:
    listener:
      auto-startup: true

product:
  init:
    enabled: ${PRODUCT_INIT_ENABLED:false}
    clear-es-on-startup: ${PRODUCT_INIT_CLEAR_ES_ON_STARTUP:false}
  reindex-on-startup: ${PRODUCT_REINDEX_ON_STARTUP:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  user:
    withdrawal:
      restore-days: 30
      purge-days: 90
      purge-cron: "0 0 3 * * *"
      mask-domain: "withdrawn.invalid"

batch:
  settlement:
    chunk-size: 100
    fee-rate: 0.05
    skip-limit: 10
    retry-limit: 3
    page-size: 100
    scheduler:
      enabled: true
      cron: "0 0 2 1 * *" # 매월 1일 오전 2시 실행
