services:
  nginx:
    image: nginx:1.27-alpine
    container_name: semicolon-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx-conf/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx-conf/certs:/etc/nginx/certs:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - backend-network

networks:
  backend-network:
    name: ${BACKEND_DOCKER_NETWORK:-beadv4_4_semicolon_be_default}
    external: true
