# 로컬 HTTPS 진입점과 Grafana 프록시를 올리는 Compose 설정입니다.
services:
  nginx:
    image: nginx:1.27-alpine
    container_name: semicolon-nginx
    environment:
      - GRAFANA_UPSTREAM=${LOCAL_GRAFANA_UPSTREAM:-host.docker.internal:13000}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx-conf/default.conf:/etc/nginx/templates/default.conf.template:ro
      - ./nginx-conf/certs:/etc/nginx/certs:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
